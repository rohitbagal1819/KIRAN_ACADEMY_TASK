
<!DOCTYPE html>
<html>
<head>
    <title>Employee Form</title>
</head>
<body>

    <h2>Form</h2>

    <form id="form">
        Enter ID: <input type="number" id="id" required><br><br>
        Enter Name: <input type="text" id="name" required><br><br>
        Enter Role: <input type="text" id="role" required><br><br>
        Enter Salary: <input type="number" id="salary" required><br><br>

        <button type="submit">Submit</button>
    </form>

    <br>

    <table border="1" width="100%">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Role</th>
                <th>Salary</th>
            </tr>
        </thead>
        <tbody id="data"></tbody>
    </table>

    <script>
        const form = document.getElementById("form");
        const table = document.getElementById("data");

        form.onsubmit = (e) => {
            e.preventDefault();

            const id = document.getElementById("id").value;
            const name = document.getElementById("name").value;
            const role = document.getElementById("role").value;
            const salary = document.getElementById("salary").value;
            const row = table.insertRow();
            row.innerHTML = `
                <td>${id}</td>
                <td>${name}</td>
                <td>${role}</td>
                <td>${salary}</td>
            `;
        };
    </script>
</body>
</html>
